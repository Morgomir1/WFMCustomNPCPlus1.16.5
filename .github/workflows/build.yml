name: Build mod

on:
  push:
    branches: [master, geckolib-integration]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check WFM compile jar
        run: test -f lib/WFM-1.0-noresources.jar

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: CustomNPCs-1.16.5-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
