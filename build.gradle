plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'noppes.npcs'
version = '1.16.5-1.0.0'

java {
    archivesBaseName = 'CustomNPCs v1.16.5'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            //duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            //from zipTree('lib/' + archivesBaseName + '-deobf.jar')
            mods {
                ElicianTweaker {
                    source sourceSets.main
                }
            }
            args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker', '--mixin', 'customnpcs.mixins.json'
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
            args '--mixin', 'customnpcs.mixins.json'
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'econ2', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'lib'
    }
}

mixin {
    add sourceSets.main, "customnpcs.refmap.json"
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
    compileOnly name: archivesBaseName+'-deobf'
    implementation fg.deobf('lib:geckolib-forge-1.16.5:3.0.106')
    implementation fg.deobf('lib:wfmtelegraph:1.0.0-1.16.5')
    // Sibling WFM (official mappings classes) — PledgeAllegianceChangedEvent / Allegiance
    compileOnly files("${rootProject.projectDir}/../WFM1.16.5/build/classes/java/main")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from zipTree('lib/' + archivesBaseName + '.jar')
    manifest {
        attributes([
                "Specification-Title"     : "examplemod",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
                "MixinConfigs": "customnpcs.mixins.json", // Конфигурации миксинов, через зяпятую если их несколько
                "FMLCorePluginContainsFMLMod": "true",  // Не забываем указать эти два флага,
                "ForceLoadAsMod": "true",               // чтобы Forge нормально загрузил и мод, и миксины
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

compileJava.dependsOn('copyClassesFromDeobf')
compileJava.finalizedBy('copyResourcesFromDeobf')

tasks.register('copyClassesFromDeobf', Copy) {
    from(zipTree('lib/' + archivesBaseName + '-deobf.jar')){
        include "**/*.class"
    }
    into layout.buildDirectory.dir("classes\\java\\main");
}

/**
 * Base jar resources first, but never wipe Mixin AP output for customnpcs.refmap.json —
 * otherwise local mixin remaps are lost when deobf resources overwrite the AP refmap.
 */
tasks.register('copyResourcesFromDeobf', Copy) {
    from(zipTree('lib/' + archivesBaseName + '-deobf.jar')){
        exclude "**/*.class"
        exclude "customnpcs.refmap.json"
        exclude "customnpcs.mixins.json"
    }
    into layout.buildDirectory.dir("resources\\main");
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
copyResourcesFromDeobf.finalizedBy('mergeMixinRefmap', 'restoreMixinConfig')

tasks.register('restoreMixinConfig', Copy) {
    from('src/main/resources/customnpcs.mixins.json')
    into layout.buildDirectory.dir('resources/main')
}

tasks.register('mergeMixinRefmap') {
    doLast {
        def outFile = file("${buildDir}/resources/main/customnpcs.refmap.json")
        def baseDir = file("${buildDir}/tmp/deobf-refmap")
        baseDir.mkdirs()
        copy {
            from(zipTree('lib/' + archivesBaseName + '-deobf.jar')) {
                include 'customnpcs.refmap.json'
            }
            into baseDir
        }
        def baseFile = new File(baseDir, 'customnpcs.refmap.json')
        def apCandidates = [
                file("${buildDir}/tmp/compileJava/compileJava-refmap.json"),
                file("${buildDir}/tmp/compileJava/customnpcs.refmap.json"),
                outFile
        ]
        def apFile = apCandidates.find { it.exists() && it.text.contains('"noppes/npcs/mixin/') }
                ?: apCandidates.find { it.exists() }

        def slurper = new groovy.json.JsonSlurper()
        def base = baseFile.exists() ? slurper.parse(baseFile) : [mappings: [:], data: [searge: [:]]]
        def ap = (apFile != null && apFile.exists()) ? slurper.parse(apFile) : [mappings: [:], data: [searge: [:]]]

        def mergeSection = { Map into, Map from ->
            from.each { k, v ->
                if (v instanceof Map && into[k] instanceof Map) {
                    into[k] = new LinkedHashMap(into[k])
                    into[k].putAll(v)
                } else {
                    into[k] = v
                }
            }
        }

        def mappings = new LinkedHashMap(base.mappings ?: [:])
        mergeSection(mappings, ap.mappings ?: [:])
        def searge = new LinkedHashMap((base.data?.searge) ?: [:])
        mergeSection(searge, (ap.data?.searge) ?: [:])

        def merged = [mappings: mappings, data: [searge: searge]]
        outFile.parentFile.mkdirs()
        outFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged))
        logger.lifecycle("Merged mixin refmap entries: ${mappings.size()}")
    }
}

jar.dependsOn('mergeMixinRefmap')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
